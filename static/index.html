<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Translator</title>
  <!-- Tailwind via CDN (dev-friendly) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <header class="mb-6">
      <h1 class="text-3xl font-semibold tracking-tight">Tiny Translator</h1>
      <p class="text-slate-600 mt-1">Record speech to translate, or type text to get a pronunciation guide.</p>
    </header>

    <!-- New: Type-to-speak (phonetic coach) -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-6">
      <h2 class="text-lg font-medium mb-3">Type to speak</h2>
      <div class="grid gap-3">
        <textarea id="ttsInput" rows="2" placeholder="Type what you want to say…"
                  class="w-full rounded-xl border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
        <div class="flex items-center gap-3">
          <label class="text-sm text-slate-600">Target</label>
          <select id="targetLang" class="rounded-lg border border-slate-300 px-2 py-1">
            <option>Spanish</option>
            <option>French</option>
            <option>Italian</option>
            <option>German</option>
            <option>Portuguese</option>
            <option>Japanese</option>
            <option>Mandarin Chinese</option>
            <option>Korean</option>
            <option>Arabic</option>
            <option>Hindi</option>
          </select>
          <button id="phoneticBtn"
            class="ml-auto px-4 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50">
            Phonetic
          </button>
        </div>

        <!-- HUD-like big line for the pronunciation -->
        <div id="phoneticHUD"
            class="mt-2 rounded-2xl border border-slate-200 bg-white text-slate-900 px-5 py-6 text-center shadow-sm ring-1 ring-slate-100">
          <div id="phoneticText" class="text-3xl md:text-4xl font-semibold tracking-tight leading-tight min-h-12"></div>
          <div id="phoneticMeta" class="text-xs text-slate-500 mt-1"></div>
        </div>


      </div>
    </section>

    <!-- Existing: Mic record -> WS translate -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-6">
      <h2 class="text-lg font-medium mb-3">Speak to translate</h2>
      <div class="flex items-center gap-3">
        <button id="recordBtn"
          class="px-5 py-2.5 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 active:bg-slate-100 transition">
          Start recording
        </button>
        <span id="status" class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-700">idle</span>
        <span id="mime" class="text-xs text-slate-500"></span>
      </div>

      <div class="mt-4 hidden" id="previewWrap">
        <p class="text-sm text-slate-600 mb-1">Preview</p>
        <audio id="player" controls class="w-full"></audio>
      </div>

    </section>

    <section>
      <h2 class="text-lg font-medium mb-3">History</h2>
      <div id="log" class="grid gap-3"></div>
    </section>
  </div>

  <script>
    // ---------- Phonetic (type-to-speak) ----------
    const ttsInput = document.getElementById('ttsInput');
    const targetLang = document.getElementById('targetLang');
    const phoneticBtn = document.getElementById('phoneticBtn');
    const phoneticText = document.getElementById('phoneticText');
    const phoneticMeta = document.getElementById('phoneticMeta');

    phoneticBtn.addEventListener('click', async () => {
      const text = (ttsInput.value || '').trim();
      if (!text) return;
      phoneticMeta.textContent = 'Generating…';
      try {
        const res = await fetch('/api/phonetic', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, target: targetLang.value })
        });
        if (!res.ok) throw new Error('Server error: ' + res.status);
        const data = await res.json();
        phoneticText.textContent = data.phonetic || '';
        phoneticMeta.textContent = data.target ? `Target: ${data.target}` : '';
      } catch (e) {
        phoneticText.textContent = '';
        phoneticMeta.textContent = 'Error';
        alert(e.message || 'Error');
      }
    });

    // Keyboard sugar: Enter to trigger phonetic when focused in textarea
    ttsInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'enter') {
        e.preventDefault();
        phoneticBtn.click();
      }
    });

    // ---------- Mic translate (your existing WS flow) ----------
    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');
    const player = document.getElementById('player');
    const previewWrap = document.getElementById('previewWrap');
    const log = document.getElementById('log');
    const mimeEl = document.getElementById('mime');

    let mediaRecorder, ws, recording = false, chunks = [];

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'}[s]));
    }
    function wsUrl(path) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      return `${proto}://${location.host}${path}`;
    }

    async function startRecording() {
      const preferred = [
        'audio/webm;codecs=opus',
        'audio/webm',
        'audio/ogg;codecs=opus',
        'audio/ogg',
        'audio/mp4'
      ];
      const supported = preferred.find(t => MediaRecorder.isTypeSupported?.(t));
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, supported ? { mimeType: supported } : undefined);
      mimeEl.textContent = mediaRecorder.mimeType ? `format: ${mediaRecorder.mimeType}` : '';

      ws = new WebSocket(wsUrl('/ws/translate'));
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusEl.textContent = 'recording...';
        ws.send(JSON.stringify({ type: 'start', mimeType: mediaRecorder.mimeType || 'audio/webm' }));
        chunks = [];
        mediaRecorder.start(250);
      };

      mediaRecorder.ondataavailable = async e => {
        if (e.data && e.data.size > 0) {
          chunks.push(e.data);
          if (ws && ws.readyState === WebSocket.OPEN) {
            const buf = await e.data.arrayBuffer();
            ws.send(buf);
          }
        }
      };

      mediaRecorder.onstop = async () => {
        if (chunks.length) {
          const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          player.src = URL.createObjectURL(blob);
          previewWrap.classList.remove('hidden');
        }
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'stop' }));
        }
      };

      ws.onmessage = evt => {
        try {
          const data = JSON.parse(evt.data);
          if (data.type === 'result') {
            addResultCard(data.transcript, data.translation, data.latency_ms);
            statusEl.textContent = 'idle';
          } else if (data.type === 'error') {
            statusEl.textContent = 'error';
            alert(data.message || 'Server error');
          }
        } catch {}
      };

      ws.onclose = () => {};

      recording = true;
      recordBtn.textContent = 'Stop and translate';
      recordBtn.classList.remove('bg-white','hover:bg-slate-50');
      recordBtn.classList.add('bg-red-600','text-white','hover:bg-red-700','border-red-600');
    }

    function stopRecording() {
      if (!recording) return;
      recording = false;
      recordBtn.textContent = 'Start recording';
      recordBtn.classList.add('bg-white','hover:bg-slate-50','border-slate-300','text-slate-900');
      recordBtn.classList.remove('bg-red-600','text-white','hover:bg-red-700','border-red-600');
      statusEl.textContent = 'processing...';
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    function addResultCard(transcript, translation, latency) {
      const card = document.createElement('div');
      card.className = 'bg-white border border-slate-200 rounded-2xl shadow-sm p-4';
      card.innerHTML = `
        <div class="text-sm text-slate-500 mb-1">latency: ${Number(latency || 0).toFixed(0)} ms</div>
        <div class="mb-1">
          <div class="text-xs font-semibold text-slate-600 mb-0.5">Transcript</div>
          <div class="text-slate-800">${escapeHtml(transcript)}</div>
        </div>
        <div>
          <div class="text-xs font-semibold text-slate-600 mb-0.5">Translation</div>
          <div class="text-slate-900 font-medium">${escapeHtml(translation)}</div>
        </div>
      `;
      log.prepend(card);
    }

    recordBtn.addEventListener('click', () => recording ? stopRecording() : startRecording());
  </script>
</body>
</html>
