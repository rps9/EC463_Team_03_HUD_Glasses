[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hudini-phonemizer"
version = "0.1.0"
description = "Offline, text-only phonetic formatting pipeline for HUDini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "epitran==1.34.0",
  "jieba==0.42.1",
  "phonemizer==3.3.0",
  "pypinyin==0.55.0",
  "uroman==1.3.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
