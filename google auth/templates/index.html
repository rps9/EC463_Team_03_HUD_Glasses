<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Google Auth Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
      pre { background: #f6f6f6; padding: 12px; border-radius: 10px; overflow: auto; }
      button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; background: white; cursor: pointer; }
    </style>
  </head>

  <body>
    <h2>HUDini Sign in</h2>

    <div class="card">
      <div
        id="g_id_onload"
        data-client_id="{{ google_client_id }}"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false"
      ></div>

      <div class="g_id_signin" data-type="standard" data-size="large"></div>

      <p style="margin-top: 16px;">
        <button onclick="loadMe()">Logged in?</button>
        <button onclick="loadUserData()">User Data</button>
        <button onclick="logout()">Logout</button>
      </p>

      <pre id="out">Not signed in yet.</pre>
    </div>

    <script>
      async function handleCredentialResponse(response) {
        const body = new URLSearchParams({ credential: response.credential });
        const r = await fetch("/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });
        document.getElementById("out").textContent = JSON.stringify(await r.json(), null, 2);
      }

      async function loadMe() {
        const r = await fetch("/me");
        const data = await r.json();

        if (!data.logged_in) {
          document.getElementById("out").textContent = "No one is logged in.";
          return;
        }

        document.getElementById("out").textContent =
          `Logged in as:\n` +
          `name: ${data.user.name}\n` +
          `email: ${data.user.email}\n` +
          `unique id (sub): ${data.user.sub}\n\n` +
          `Full JSON:\n` + JSON.stringify(data, null, 2);
      }

      async function loadUserData() {
        const r = await fetch("/user-data");
        const data = await r.json();

        if (!data.ok) {
          document.getElementById("out").textContent = data.error || "Failed to load user data.";
          return;
        }

        document.getElementById("out").textContent =
          `User Data for sub=${data.sub}\n\n` + JSON.stringify(data.data, null, 2);
      }

      async function logout() {
        const r = await fetch("/logout", { method: "POST" });
        document.getElementById("out").textContent = JSON.stringify(await r.json(), null, 2);
      }
    </script>
  </body>
</html>
