<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUDini — User Data</title>
    <style>
      :root {
        --bg0: #070A12;
        --bg1: #0B1020;
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.64);
        --muted2: rgba(255, 255, 255, 0.46);
        --accent: #7C5CFF;
        --accent2: #36D1DC;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
        --radius: 22px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        color: var(--text);
        background:
          radial-gradient(1200px 700px at 15% 10%, rgba(124, 92, 255, 0.22), transparent 60%),
          radial-gradient(900px 600px at 85% 30%, rgba(54, 209, 220, 0.18), transparent 60%),
          radial-gradient(900px 700px at 60% 90%, rgba(124, 92, 255, 0.14), transparent 62%),
          linear-gradient(180deg, var(--bg0), var(--bg1));
        display: grid;
        place-items: center;
        padding: 28px;
      }

      /* Phone shell */
      .phone {
        width: 390px;
        height: 780px;
        border-radius: 44px;
        background:
          radial-gradient(900px 600px at 50% -10%, rgba(255,255,255,0.18), transparent 45%),
          linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
        border: 1px solid rgba(255,255,255,0.16);
        box-shadow: var(--shadow);
        position: relative;
        padding: 18px;
      }

      .bezel {
        position: absolute;
        inset: 10px;
        border-radius: 38px;
        background:
          radial-gradient(600px 420px at 50% 0%, rgba(124,92,255,0.16), transparent 55%),
          linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.55));
        border: 1px solid rgba(255,255,255,0.10);
        overflow: hidden;
      }

      .notch {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 30px;
        border-radius: 0 0 18px 18px;
        background: rgba(0,0,0,0.75);
        border: 1px solid rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        z-index: 3;
      }
      .speaker {
        width: 54px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255,255,255,0.14);
      }
      .cam {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255,255,255,0.18);
        border: 1px solid rgba(255,255,255,0.10);
      }

      .screen {
        position: absolute;
        inset: 0;
        padding: 54px 16px 16px 16px; /* space for notch */
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 12px;
      }

      .topbar {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .title {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.2px;
      }

      .subtitle {
        margin: 2px 0 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }

      .pill {
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(124, 92, 255, 0.18);
        border: 1px solid rgba(124, 92, 255, 0.28);
        color: rgba(255,255,255,0.88);
        font-size: 12px;
        white-space: nowrap;
      }

      .searchRow {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .search {
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 14px;
        padding: 10px 12px;
        color: var(--text);
        outline: none;
      }
      .search::placeholder { color: var(--muted2); }

      .btn {
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(255,255,255,0.06);
        color: rgba(255,255,255,0.88);
        padding: 10px 12px;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.05s ease, background 0.2s ease, border 0.2s ease;
        user-select: none;
      }
      .btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.20); }
      .btn:active { transform: scale(0.99); }

      .list {
        overflow: auto;
        padding-right: 6px;
      }
      .list::-webkit-scrollbar { width: 10px; }
      .list::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.14);
        border-radius: 999px;
        border: 2px solid rgba(0,0,0,0.4);
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: var(--radius);
        padding: 14px 14px 12px;
        margin-bottom: 12px;
        box-shadow: 0 14px 36px rgba(0,0,0,0.20);
        backdrop-filter: blur(10px);
      }

      .cardHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      .langBadge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(124,92,255,0.22), rgba(54,209,220,0.16));
        border: 1px solid rgba(255,255,255,0.14);
        font-size: 12px;
        color: rgba(255,255,255,0.9);
      }

      .tiny {
        color: var(--muted2);
        font-size: 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .field {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 16px;
        padding: 10px 11px;
      }

      .label {
        font-size: 11px;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: var(--muted2);
        margin-bottom: 6px;
      }

      .value {
        font-size: 13.5px;
        line-height: 1.35;
        color: rgba(255,255,255,0.92);
        word-break: break-word;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      @media (max-width: 420px) {
        .phone { width: 100%; height: 760px; }
      }
    </style>
  </head>

  <body>
    <div class="phone" role="img" aria-label="Phone mockup containing HUDini UI">
      <div class="bezel">
        <div class="notch" aria-hidden="true">
          <div class="speaker"></div>
          <div class="cam"></div>
        </div>

        <div class="screen">
          <div class="topbar">
            <div>
              <h3 class="title">User Data</h3>
              <p class="subtitle">John Doe</p>
            </div>
            <div class="pill" id="countPill">0 entries</div>
          </div>

          <div class="searchRow">
            <input id="search" class="search" placeholder="Search (e.g., Spanish, hola, suggested...)" />
            <button id="reset" class="btn" title="Reset search">Reset</button>
          </div>

          <div id="list" class="list" aria-label="Translation cards list"></div>
        </div>
      </div>
    </div>

    <script>
      // Demo data — Spanish entries first (as requested)
      const DATA = [
        {
          language: "Spanish",
          heardPhrase: "Hola, ¿cómo estás?",
          translatedHeard: "Hi, how are you?",
          suggestedResponse: "Bien, ¿y tú?",
          translatedSuggested: "Good, and you?"
        },
        {
          language: "Spanish",
          heardPhrase: "¿Dónde está el baño?",
          translatedHeard: "Where is the bathroom?",
          suggestedResponse: "Está a la derecha.",
          translatedSuggested: "It’s on the right."
        },
        {
          language: "Spanish",
          heardPhrase: "¿Cuánto cuesta esto?",
          translatedHeard: "How much does this cost?",
          suggestedResponse: "¿Aceptan tarjeta?",
          translatedSuggested: "Do you accept card?"
        },
        {
          language: "Spanish",
          heardPhrase: "Perdón, no entiendo.",
          translatedHeard: "Sorry, I don’t understand.",
          suggestedResponse: "¿Puedes repetirlo más despacio?",
          translatedSuggested: "Can you repeat it more slowly?"
        },
        {
          language: "French",
          heardPhrase: "Où est la gare ?",
          translatedHeard: "Where is the train station?",
          suggestedResponse: "Elle est à deux minutes d’ici.",
          translatedSuggested: "It’s two minutes from here."
        },
        {
          language: "Hebrew",
          heardPhrase: "אפשר לקבל חשבון בבקשה?",
          translatedHeard: "Can I get the bill, please?",
          suggestedResponse: "כן, תודה רבה.",
          translatedSuggested: "Yes, thank you very much."
        },
        {
          language: "Japanese",
          heardPhrase: "すみません、英語は話せますか？",
          translatedHeard: "Excuse me, do you speak English?",
          suggestedResponse: "少しだけです。",
          translatedSuggested: "Only a little."
        },
        {
          language: "Italian",
          heardPhrase: "Quanto costa?",
          translatedHeard: "How much does it cost?",
          suggestedResponse: "Posso pagare con carta?",
          translatedSuggested: "Can I pay by card?"
        }
      ];

      const listEl = document.getElementById("list");
      const searchEl = document.getElementById("search");
      const resetEl = document.getElementById("reset");
      const countPill = document.getElementById("countPill");

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function render(items) {
        countPill.textContent = `${items.length} entr${items.length === 1 ? "y" : "ies"}`;

        listEl.innerHTML = items
          .map((item, idx) => {
            return `
              <div class="card">
                <div class="cardHeader">
                  <div class="langBadge">
                    <span style="opacity:0.85">Language</span>
                    <strong>${escapeHtml(item.language)}</strong>
                  </div>
                  <div class="tiny">#${idx + 1}</div>
                </div>

                <div class="grid">
                  <div class="field">
                    <div class="label">Heard phrase</div>
                    <div class="value">${escapeHtml(item.heardPhrase)}</div>
                  </div>

                  <div class="field">
                    <div class="label">Translated</div>
                    <div class="value">${escapeHtml(item.translatedHeard)}</div>
                  </div>

                  <div class="split">
                    <div class="field">
                      <div class="label">Suggested response</div>
                      <div class="value">${escapeHtml(item.suggestedResponse)}</div>
                    </div>

                    <div class="field">
                      <div class="label">Translated</div>
                      <div class="value">${escapeHtml(item.translatedSuggested)}</div>
                    </div>
                  </div>
                </div>
              </div>
            `;
          })
          .join("");
      }

      function applyFilter() {
        const q = searchEl.value.trim().toLowerCase();
        if (!q) return render(DATA);

        const filtered = DATA.filter((x) => {
          const blob = [
            x.language,
            x.heardPhrase,
            x.translatedHeard,
            x.suggestedResponse,
            x.translatedSuggested
          ]
            .join(" ")
            .toLowerCase();
          return blob.includes(q);
        });

        render(filtered);
      }

      searchEl.addEventListener("input", applyFilter);
      resetEl.addEventListener("click", () => {
        searchEl.value = "";
        render(DATA);
        searchEl.focus();
      });

      render(DATA);
    </script>
  </body>
</html>
